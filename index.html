const Section = ({ id, className = "", children }) => {
  const ref = useRef(null);
  const [isVisible, setIsVisible] = useState(false);
  useEffect(() => {
    const observer = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setIsVisible(true); observer.unobserve(entry.target); }
    }, { threshold: 0.05 });
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, []);
  return (
    <section id={id} ref={ref} className={`py-14 md:py-28 px-5 ${className} fade-in ${isVisible ? "visible" : ""}`}>
      <div className="max-w-6xl mx-auto">{children}</div>
    </section>
  );
};

const LiveNotice = () => {
  const messages = useMemo(() => ([
    "이*훈님 방금 주말 오후 상담 신청",
    "서*연님 앱 포인트 5,000원 적립",
    "김*석님 1:1 채팅 문의 중",
    "최*현님 주말 저녁 상담 신청 완료",
    "박*준님 평일 오전 상담 신청"
  ]), []);
  const [show, setShow] = useState(false);
  const [idx, setIdx] = useState(0);

  useEffect(() => {
    const showTimer = setTimeout(() => setShow(true), 3000);
    const interval = setInterval(() => {
      setShow(false);
      setTimeout(() => {
        setIdx(prev => (prev + 1) % messages.length);
        setShow(true);
      }, 500);
    }, 9000);
    return () => { clearTimeout(showTimer); clearInterval(interval); };
  }, [messages.length]);

  if (!show) return null;

  return (
    <div className="fixed left-5 bottom-24 md:bottom-10 z-[100] transition-all duration-500 transform translate-y-0 opacity-100">
      <div className="bg-slate-900 text-white shadow-2xl rounded-2xl px-5 py-4 flex items-center gap-3 border border-slate-700">
        <div className="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-lg shadow-inner">🔥</div>
        <div>
          <div className="text-xs md:text-sm font-black text-white">{messages[idx]}</div>
          <div className="text-[10px] text-slate-400 font-bold mt-0.5 tracking-tight">실시간 현황</div>
        </div>
      </div>
    </div>
  );
};

// --- 3. 마감 카운트다운 (신청 섹션용) ---
const FormTimer = () => {
  const [seconds, setSeconds] = useState(900); // 15분
  useEffect(() => {
    if (seconds <= 0) return;
    const t = setInterval(() => setSeconds(s => s - 1), 1000);
    return () => clearInterval(t);
  }, [seconds]);
  const min = Math.floor(seconds / 60);
  const sec = seconds % 60;
  return (
    <div className="bg-red-50 border border-red-100 p-4 rounded-2xl mb-8 text-center">
      <p className="text-red-600 font-black text-sm md:text-lg tracking-tight">
        🚨 특별 상담 혜택 마감까지 <span className="tabular-nums font-mono">{min}:{sec.toString().padStart(2, '0')}</span>
      </p>
      <p className="text-red-400 text-[10px] md:text-xs font-bold mt-1 tracking-tight">지금 신청서를 작성해야 3월 우선 배정권이 부여됩니다.</p>
    </div>
  );
};

const Header = () => {
  const [timeLeft, setTimeLeft] = useState({ hours: 0, minutes: 0, seconds: 0 });
  useEffect(() => {
    const target = new Date();
    target.setHours(23, 59, 59);
    const timer = setInterval(() => {
      const now = new Date();
      const diff = target - now;
      if (diff <= 0) target.setDate(target.getDate() + 1);
      else setTimeLeft({
        hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
        minutes: Math.floor((diff / 1000 / 60) % 60),
        seconds: Math.floor((diff / 1000) % 60)
      });
    }, 1000);
    return () => clearInterval(timer);
  }, []);

  return (
    <nav className="fixed top-0 left-0 w-full z-50 glass-nav border-b border-slate-100">
      <div className="max-w-6xl mx-auto px-5 py-3.5 flex justify-between items-center">
        <div className="text-xl font-[900] tracking-tighter text-emerald-600 cursor-pointer" onClick={() => window.scrollTo({top:0, behavior:'smooth'})}>
          스승님<span className="text-slate-300 font-normal ml-0.5 text-sm italic tracking-normal">SSNIM</span>
        </div>
        <div className="hidden md:flex items-center gap-6 text-sm font-bold">
          <a href="#curriculum" onClick={(e) => {e.preventDefault(); scrollToId('curriculum');}} className="hover:text-emerald-600 transition-colors">커리큘럼</a>
          <a href="#reviews" onClick={(e) => {e.preventDefault(); scrollToId('reviews');}} className="hover:text-emerald-600 transition-colors">후기</a>
          <a href="#apply" onClick={(e) => {e.preventDefault(); scrollToId('apply');}} className="bg-emerald-600 text-white px-5 py-2 rounded-xl hover:bg-emerald-700 transition-all shadow-md">상담신청</a>
        </div>
        <div className="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-[10px] md:text-xs font-black flex items-center gap-1.5 tabular-nums border border-slate-700">
          <span className="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></span>
          3월 상담 마감 {timeLeft.hours.toString().padStart(2, '0')}:{timeLeft.minutes.toString().padStart(2, '0')}:{timeLeft.seconds.toString().padStart(2, '0')}
        </div>
      </div>
    </nav>
  );
};

            <span className="text-[9px] md:text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-black tracking-tight">{r.score}</span>
          </div>
        </div>
      ))}

);

const FAQ = () => {
  const [open, setOpen] = useState(null);
  const items = [
    {q: "카드 결제가 가능한가요?", a: "네, 모든 카드 결제가 가능하며 전 카드사 무이자 할부 혜택도 상담 시 확인하실 수 있습니다."},
    {q: "초보도 수강 가능한가요?", a: "네, 구력에 상관없이 현재 본인의 가장 큰 고민(컨택, 거리감 등)에 맞춰 커리큘럼 난이도를 조절해 드립니다."},
    {q: "준비물은 무엇인가요?", a: "평소 사용하시는 웨지와 퍼터, 장갑을 준비해 주세요. 장비가 없으신 경우 상담 시 미리 말씀해주시면 대여 안내를 도와드립니다."},
    {q: "상담 후 취소 가능한가요?", a: "네, 상담은 100% 무료이며 일정 조율 단계에서 언제든 자유롭게 취소 가능합니다."}
  ];
  return (
    <Section className="bg-slate-50">
      <div className="max-w-2xl mx-auto text-left">
        <h2 className="text-2xl md:text-4xl font-black mb-10 text-center tracking-tighter italic text-slate-900">자주 묻는 질문</h2>
        <div className="space-y-3">
          {items.map((item, idx) => (
            <div key={idx} className="bg-white rounded-[20px] overflow-hidden shadow-sm border border-slate-100">
              <button onClick={() => setOpen(open === idx ? null : idx)} className="w-full p-5 text-left flex justify-between items-center font-bold text-sm md:text-base transition-colors hover:bg-slate-50">
                <span className={open === idx ? 'text-emerald-600' : 'text-slate-900'}>{item.q}</span>
                <span className={`transform transition-transform text-[10px] ${open === idx ? 'rotate-180 text-emerald-600' : 'text-slate-300'}`}>▼</span>
              </button>
              {open === idx && <div className="p-5 pt-0 text-slate-500 text-xs md:text-sm leading-relaxed font-medium bg-slate-50/30">{item.a}</div>}
            </div>
          ))}
        </div>
      </div>
    </Section>
  );
};

const ApplicationForm = () => {
  const [status, setStatus] = useState("IDLE");
  const handleSubmit = async (e) => {
    e.preventDefault();
    setStatus("SUBMITTING");
    const formData = new FormData(e.currentTarget);
    try {
      const response = await fetch("https://formspree.io/f/mbdakbon", {
        method: "POST",
        body: JSON.stringify(Object.fromEntries(formData)),
        headers: { Accept: "application/json", "Content-Type": "application/json" }
      });
      if (response.ok) setStatus("SUCCESS"); else setStatus("ERROR");
    } catch { setStatus("ERROR"); }
  };

  return (
    <Section id="apply" className="bg-white">
      <div className="grid lg:grid-cols-2 gap-12 md:gap-20 items-start text-left">
        <div className="space-y-8 md:space-y-12">
          <div>
            <Badge text="Reservation" />
            <h2 className="text-2xl md:text-6xl font-black mt-4 md:mt-6 tracking-tighter italic text-slate-900 leading-tight">3월 숏게임 상담예약</h2>
            <p className="text-sm md:text-lg text-slate-500 font-medium mt-4 md:mt-6 leading-relaxed">
              상담을 신청하시면 스승님 담당자가 <br className="md:hidden"/>
              최적의 일정과 장소를 조율해 드립니다. <br />
              <span className="text-emerald-600 font-bold underline decoration-emerald-100 decoration-2 md:decoration-4 underline-offset-2">상담은 무료이며, 진행 여부는 자유롭게 결정하세요.</span>
            </p>
          </div>
          <div className="bg-slate-900 text-white p-8 md:p-12 rounded-[32px] md:rounded-[48px] shadow-2xl space-y-6 md:space-y-8 relative overflow-hidden">
             <h4 className="text-base md:text-xl font-black text-emerald-400 italic">3월 패키지 혜택 요약</h4>
             <ul className="space-y-4 md:space-y-5 text-xs md:text-base font-bold">
                <li className="flex justify-between border-b border-white/10 pb-3 md:pb-4"><span>프로그램</span> <span>실내/야외 120분</span></li>
                <li className="flex justify-between border-b border-white/10 pb-3 md:pb-4"><span>상담가</span> <span className="text-emerald-400">185,000원</span></li>
                <li className="flex justify-between border-b border-white/10 pb-3 md:pb-4"><span>특별 지원</span> <span className="text-yellow-400">제주 항공비*</span></li>
                <li className="flex justify-between"><span>만족 보장</span> <span>100% 재레슨/환불</span></li>
             </ul>
          </div>
        </div>

        <div className="bg-slate-50 p-7 md:p-14 rounded-[32px] md:rounded-[56px] border border-slate-200 relative">
          <FormTimer />
          {status === "SUCCESS" ? (
            <div className="text-center py-12 md:py-20">
              <div className="text-5xl md:text-7xl mb-6 md:mb-10">🏌️‍♂️</div>
              <h3 className="text-xl md:text-3xl font-black mb-2 md:mb-4 text-slate-900">상담 예약 접수 완료</h3>
              <p className="text-xs md:text-base text-slate-500 font-medium">매니저가 확인 후 30분 내로 <br/> 카카오톡 안내를 보내드립니다.</p>
            </div>
          ) : (
            <form onSubmit={handleSubmit} className="space-y-6 md:space-y-8">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
                <div className="space-y-1.5 md:space-y-2">
                   <label className="text-[10px] md:text-[11px] font-black text-slate-400 ml-1 tracking-widest uppercase">성함</label>
                   <input required name="이름" placeholder="홍길동" className="w-full p-4 md:p-5 rounded-xl md:rounded-2xl bg-white border-none focus:ring-2 focus:ring-emerald-500 shadow-sm text-base" />
                </div>
                <div className="space-y-1.5 md:space-y-2">
                   <label className="text-[10px] md:text-[11px] font-black text-slate-400 ml-1 tracking-widest uppercase">연락처</label>
                   <input required name="연락처" type="tel" placeholder="010-0000-0000" className="w-full p-4 md:p-5 rounded-xl md:rounded-2xl bg-white border-none focus:ring-2 focus:ring-emerald-500 shadow-sm text-base" />
                </div>
              </div>

              <div className="space-y-3 md:space-y-4">
                 <label className="text-[10px] md:text-[11px] font-black text-emerald-600 ml-1 tracking-widest uppercase italic">희망 일정 (중복 선택)</label>
                 <div className="grid grid-cols-2 gap-2 md:gap-3">
                   {["평일 낮", "평일 저녁", "주말 낮", "주말 저녁"].map(time => (
                     <label key={time} className="flex items-center gap-2 md:gap-3 p-3.5 md:p-4 bg-white rounded-xl md:rounded-2xl cursor-pointer hover:bg-emerald-50 transition-all shadow-sm border border-transparent">
                       <input type="checkbox" name="희망시간[]" value={time} className="w-4 h-4 md:w-5 md:h-5 accent-emerald-600 rounded-md" />
                       <span className="text-[11px] md:text-sm font-bold text-slate-700">{time}</span>
                     </label>
                   ))}
                 </div>
              </div>

              <div className="pt-2">
                <button disabled={status==="SUBMITTING"} className="w-full py-5 md:py-6 bg-emerald-600 text-white rounded-xl md:rounded-[24px] text-lg md:text-2xl font-[900] shadow-xl hover:bg-emerald-700 transition-all active:scale-95 pulse-soft">
                  {status === "SUBMITTING" ? "전송 중..." : "상담 예약하기 (무료)"}
                </button>
              </div>
            </form>
          )}
        </div>
      </div>
    </Section>
  );
};
