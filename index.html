<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" />
    <title>스승님 | 3월 한정 숏게임 마스터 실전 레슨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
      body { font-family: "Pretendard", sans-serif; scroll-behavior: smooth; word-break: keep-all; -webkit-font-smoothing: antialiased; }
      .glass-nav { backdrop-filter: blur(16px); background-color: rgba(255, 255, 255, 0.9); }
      .fade-in { opacity: 0; transform: translateY(20px); transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
      .fade-in.visible { opacity: 1; transform: translateY(0); }
      .app-gradient { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
      .text-gradient { background: linear-gradient(135deg, #065f46 0%, #10b981 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .pulse-soft { animation: pulse-soft 2s infinite; }
      @keyframes pulse-soft { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
      /* 모바일 가독성을 위한 줄간격 최적화 */
      p { line-height: 1.6; }
      h1, h2, h3 { line-height: 1.25; }
    </style>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 overflow-x-hidden">
    <div id="root"></div>

    <script type="module">
      import React, { useEffect, useMemo, useRef, useState } from "https://esm.sh/react@19.2.0";
      import ReactDOM from "https://esm.sh/react-dom@19.2.0/client";
      import htm from "https://esm.sh/htm@3.1.1";

      const html = htm.bind(React.createElement);

      const scrollToId = (id) => {
        const el = document.getElementById(id);
        if (el) window.scrollTo({ top: el.offsetTop - 70, behavior: "smooth" });
      };

      const Badge = ({ text, color = "bg-emerald-600" }) => html`
        <span className=${`${color} text-white px-2.5 py-1 rounded-md text-[10px] md:text-xs font-black uppercase tracking-tight inline-block`}>${text}</span>
      `;

      const Section = ({ id, className = "", children }) => {
        const ref = useRef(null);
        const [isVisible, setIsVisible] = useState(false);
        useEffect(() => {
          const observer = new IntersectionObserver(([entry]) => {
            if (entry.isIntersecting) { setIsVisible(true); observer.unobserve(entry.target); }
          }, { threshold: 0.05 });
          if (ref.current) observer.observe(ref.current);
          return () => observer.disconnect();
        }, []);
        return html`<section id=${id} ref=${ref} className=${`py-14 md:py-28 px-5 ${className} fade-in ${isVisible ? "visible" : ""}`}>
          <div className="max-w-6xl mx-auto">${children}</div>
        </section>`;
      };

      const CountdownTimer = () => {
        const [timeLeft, setTimeLeft] = useState({ hours: 0, minutes: 0, seconds: 0 });
        useEffect(() => {
          const target = new Date();
          target.setHours(23, 59, 59);
          const timer = setInterval(() => {
            const now = new Date();
            const diff = target - now;
            if (diff <= 0) target.setDate(target.getDate() + 1);
            else setTimeLeft({
              hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
              minutes: Math.floor((diff / 1000 / 60) % 60),
              seconds: Math.floor((diff / 1000) % 60)
            });
          }, 1000);
          return () => clearInterval(timer);
        }, []);
        return html`
          <div className="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-[10px] md:text-xs font-black flex items-center gap-1.5 tabular-nums border border-slate-700">
            <span className="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></span>
            3월 상담 마감 ${timeLeft.hours.toString().padStart(2, '0')}:${timeLeft.minutes.toString().padStart(2, '0')}:${timeLeft.seconds.toString().padStart(2, '0')}
          </div>
        `;
      };

      const Header = () => html`
        <nav className="fixed top-0 left-0 w-full z-50 glass-nav border-b border-slate-100/50">
          <div className="max-w-6xl mx-auto px-5 py-3.5 flex justify-between items-center">
            <div className="text-xl font-[900] tracking-tighter text-emerald-600 cursor-pointer" onClick=${() => window.scrollTo({top:0, behavior:'smooth'})}>
              스승님<span className="text-slate-300 font-normal ml-0.5 text-sm italic">SSNIM</span>
            </div>
            <div className="hidden md:flex items-center gap-6 text-sm font-bold">
              <a href="#curriculum" onClick=${(e) => (e.preventDefault(), scrollToId('curriculum'))} className="hover:text-emerald-600 transition-colors">커리큘럼</a>
              <a href="#app-benefit" onClick=${(e) => (e.preventDefault(), scrollToId('app-benefit'))} className="hover:text-emerald-600 transition-colors">앱 혜택</a>
              <a href="#apply" onClick=${(e) => (e.preventDefault(), scrollToId('apply'))} className="bg-emerald-600 text-white px-5 py-2 rounded-xl hover:bg-emerald-700 transition-all shadow-md">상담신청</a>
            </div>
            <div className="md:hidden">
              <${CountdownTimer} />
            </div>
          </div>
        </nav>
      `;

      const Hero = () => html`
        <section className="pt-28 md:pt-44 pb-12 md:pb-24 px-5 bg-white relative">
          <div className="max-w-6xl mx-auto relative z-10 text-center">
            <div className="mb-4 md:mb-6"><${Badge} text="March 2026 Season" /></div>
            <h1 className="text-[28px] md:text-[72px] font-[900] tracking-tight mb-6 text-slate-900 leading-[1.2]">
              올해 첫 라운딩,<br />
              <span className="text-gradient underline decoration-emerald-100 decoration-4 md:decoration-8 underline-offset-4">진짜 스코어</span>는<br /> 숏게임이 결정합니다
            </h1>
            <p className="text-sm md:text-xl text-slate-500 mb-8 md:mb-12 font-medium max-w-2xl mx-auto px-2 leading-relaxed">
              연습장 10시간보다 강력한 120분 실전 노하우.<br className="hidden md:block"/>
              서수연 프로가 무너진 필드 감각을 즉시 복구해 드립니다.
            </p>
            <div className="flex flex-col md:flex-row gap-3 justify-center items-center px-4">
              <button onClick=${() => scrollToId('apply')} className="w-full md:w-auto px-10 py-5 bg-emerald-600 text-white rounded-2xl text-base md:text-xl font-black shadow-xl hover:bg-emerald-700 transition-all active:scale-95 pulse-soft">
                무료 상담 신청 (잔여석 확보)
              </button>
              <a href="https://ssnim.com/install.html" target="_blank" className="w-full md:w-auto px-10 py-5 bg-slate-900 text-white rounded-2xl text-base md:text-xl font-black hover:bg-slate-800 transition-all">
                앱 전용 혜택 확인
              </a>
            </div>
          </div>
        </section>
      `;

      const UrgencyStats = () => html`
        <div className="bg-white border-y border-slate-50 py-10 px-5">
          <div className="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-6 md:gap-4 text-center">
            ${[
              {l: "이번 주 잔여석", v: "4자리", c: "text-red-500"},
              {l: "누적 수강생", v: "280명+", c: "text-slate-900"},
              {l: "평균 타수 개선", v: "-8타", c: "text-emerald-600"},
              {l: "상담 후 진행률", v: "94%", c: "text-slate-900"}
            ].map(item => html`
              <div key=${item.l} className="space-y-0.5">
                <div className="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-wider">${item.l}</div>
                <div className=${`text-2xl md:text-4xl font-[900] ${item.c}`}>${item.v}</div>
              </div>
            `)}
          </div>
        </div>
      `;

      const InstructorIntro = () => html`
        <${Section} className="bg-white">
          <div className="flex flex-col md:flex-row items-center gap-10 md:gap-20">
            <div className="w-full md:w-1/2">
              <div className="aspect-[4/5] bg-slate-100 rounded-[40px] md:rounded-[60px] overflow-hidden shadow-xl relative">
                <img src="https://images.unsplash.com/photo-1593111774240-d529f12cf4bb?auto=format&fit=crop&q=80&w=600" className="w-full h-full object-cover" alt="서수연 프로" />
                <div className="absolute bottom-5 left-5 right-5 bg-white/90 backdrop-blur-md p-5 md:p-8 rounded-[24px] md:rounded-[32px] border border-white/20">
                   <div className="text-slate-400 font-bold text-[10px] md:text-xs mb-1 uppercase tracking-widest">Head Pro</div>
                   <div className="text-xl md:text-3xl font-black text-slate-900">서수연 프로</div>
                </div>
              </div>
            </div>
            <div className="w-full md:w-1/2 space-y-6 md:space-y-10">
              <h3 className="text-2xl md:text-5xl font-[900] tracking-tighter leading-tight italic">
                "필드에서 먹히는<br />
                <span className="text-emerald-600 underline decoration-emerald-100">실전 기술</span>만 가르칩니다"
              </h3>
              <div className="space-y-4 text-sm md:text-lg text-slate-600 font-medium leading-relaxed">
                <p>연습장 매트 위에서의 완벽한 샷, 필드에선 왜 안될까요? 경사면 셋업, 잔디 결 읽기, 바람을 이기는 컨트롤은 매트 위에서 배울 수 없습니다.</p>
                <p>이번 3월 한정 패키지는 판교 실내 분석실과 용인 야외 숏게임장을 오가며 여러분의 실전 감각을 최대치로 끌어올리는 과정입니다.</p>
              </div>
              <div className="pt-4 flex gap-3">
                 <a href="https://www.instagram.com/s.o_o.yeon/" target="_blank" className="flex-1 text-center py-4 bg-slate-50 text-slate-900 rounded-2xl font-black text-xs md:text-sm hover:bg-slate-100 transition-all">Instagram ↗</a>
                 <a href="http://pf.kakao.com/_kxawRn/chat" target="_blank" className="flex-1 text-center py-4 bg-[#FEE500] text-[#3c1e1e] rounded-2xl font-black text-xs md:text-sm hover:opacity-90 transition-all">카톡 문의</a>
              </div>
            </div>
          </div>
        </${Section}>
      `;

      const AppBenefit = () => html`
        <${Section} id="app-benefit" className="bg-slate-900 text-white rounded-[40px] md:rounded-[60px] my-6 mx-4 md:mx-10 px-6 py-16 md:py-24">
          <div className="text-center mb-12 md:mb-20">
            <${Badge} text="Exclusive App Benefit" color="bg-emerald-500" />
            <h2 className="text-2xl md:text-5xl font-black mt-4 tracking-tighter italic leading-tight">스승님 앱 단독 4가지 특권</h2>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
            ${[
              {i: "✉️", t: "프로 1:1 채팅", d: "레슨 전 궁금증과 영상 피드백 실시간 상담"},
              {i: "💎", t: "포인트 즉시 지급", d: "앱 회원 한정, 결제 시 사용하는 포인트 적립"},
              {i: "✈️", t: "항공비 지원", d: "3월 패키지 수료 시 제주 캠프 항공권 지원*"},
              {i: "🔔", t: "우선 예약 알림", d: "마감된 프로의 잔여 일정을 가장 먼저 푸시 알림"}
            ].map(item => html`
              <div key=${item.t} className="bg-white/5 border border-white/10 p-7 md:p-10 rounded-[32px] md:rounded-[40px] hover:bg-white/10 transition-all">
                <div className="text-3xl md:text-4xl mb-4 md:mb-6">${item.i}</div>
                <h4 className="text-lg md:text-xl font-black mb-2 text-emerald-400">${item.t}</h4>
                <p className="text-xs md:text-sm text-slate-400 leading-relaxed font-medium">${item.d}</p>
              </div>
            `)}
          </div>
          <div className="mt-12 md:mt-20 text-center">
             <a href="https://ssnim.com/install.html" target="_blank" className="inline-block px-10 py-4 app-gradient rounded-2xl font-black text-base md:text-xl shadow-2xl hover:scale-105 transition-all">
               혜택 받고 앱으로 시작하기
             </a>
          </div>
        </${Section}>
      `;

      const Curriculum = () => html`
        <${Section} id="curriculum" className="bg-slate-50 rounded-[40px] md:rounded-[60px] mx-4 md:mx-10 my-6">
          <div className="text-center mb-12 md:mb-24 px-2">
            <${Badge} text="Practical Mastery" />
            <h2 className="text-2xl md:text-5xl font-black mt-4 tracking-tighter italic">실전 마스터 120분 커리큘럼</h2>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 md:gap-12">
            ${[
              {
                title: "Indoor: 감각 복구 (120분)",
                loc: "판교 백야드",
                theme: "blue",
                steps: [
                  {t: "뒤땅/탑볼 정밀 컨택 교정", d: "볼 위치와 체중 이동 분석"},
                  {t: "20m 이내 '붙이는' 거리감", d: "일관된 몸통 리듬과 손목 제어법 습득"},
                  {t: "퍼터 방향성 & 에이밍 정렬", d: "셋업 체크와 스퀘어 임팩트 스트로크 교정"},
                  {t: "벙커 탈출 메커니즘", d: "폭발력을 이용하는 기초 스윙 원리 습득"}
                ]
              },
              {
                title: "Outdoor: 실전 외부 (120분)",
                loc: "용인 숏게임힐스 / 파3",
                theme: "emerald",
                steps: [
                  {t: "30~90m 웨지 컨트롤", d: "거리별 클럽 선택과 비거리 조절 리듬"},
                  {t: "경사지 트러블샷 대응", d: "오르막/내리막 상황별 에이밍 노하우"},
                  {t: "그린 경사 분석 & 퍼팅", d: "홀컵 주변 라이 분석과 롱 퍼트 거리감"},
                  {t: "매니지먼트 전략", d: "리스크 관리로 타수를 지키는 코스 공략"}
                ]
              }
            ].map(part => html`
              <div key=${part.title} className="bg-white p-8 md:p-14 rounded-[40px] md:rounded-[56px] shadow-sm border border-slate-100">
                <div className="flex items-center justify-between mb-8 md:mb-12">
                   <div className=${`px-3 py-1 rounded-full text-[10px] md:text-[11px] font-black uppercase tracking-widest bg-${part.theme}-50 text-${part.theme}-600`}>Part . ${part.theme === 'blue' ? '01' : '02'}</div>
                   <div className="text-slate-400 font-bold text-[10px] md:text-xs underline underline-offset-4 decoration-slate-200">${part.loc}</div>
                </div>
                <h3 className="text-xl md:text-3xl font-black mb-8 md:mb-12 text-slate-900">${part.title}</h3>
                <div className="space-y-6 md:space-y-10">
                  ${part.steps.map((step, idx) => html`
                    <div key=${idx} className="flex gap-4 md:gap-6 group">
                      <div className=${`text-xl md:text-3xl font-[900] italic text-${part.theme}-500/20`}>${(idx + 1).toString().padStart(2, '0')}</div>
                      <div>
                         <h4 className="text-base md:text-lg font-black text-slate-900 mb-1">${step.t}</h4>
                         <p className="text-xs md:text-sm text-slate-500 font-medium leading-relaxed">${step.d}</p>
                      </div>
                    </div>
                  `)}
                </div>
              </div>
            `)}
          </div>
        </${Section}>
      `;

      const ApplicationForm = () => {
        const [status, setStatus] = useState("IDLE");
        const handleSubmit = async (e) => {
          e.preventDefault();
          setStatus("SUBMITTING");
          const formData = new FormData(e.currentTarget);
          try {
            const response = await fetch("https://formspree.io/f/mbdakbon", {
              method: "POST",
              body: JSON.stringify(Object.fromEntries(formData)),
              headers: { Accept: "application/json", "Content-Type": "application/json" }
            });
            if (response.ok) setStatus("SUCCESS"); else setStatus("ERROR");
          } catch { setStatus("ERROR"); }
        };

        return html`
          <${Section} id="apply" className="bg-white">
            <div className="grid lg:grid-cols-2 gap-12 md:gap-20 items-start">
              <div className="space-y-8 md:space-y-12">
                <div>
                  <${Badge} text="Reservation" />
                  <h2 className="text-2xl md:text-6xl font-black mt-4 md:mt-6 tracking-tighter italic">3월 숏게임 상담예약</h2>
                  <p className="text-sm md:text-lg text-slate-500 font-medium mt-4 md:mt-6 leading-relaxed">
                    상담을 신청하시면 스승님 담당자가 <br className="md:hidden"/>
                    최적의 일정과 장소를 조율해 드립니다. <br />
                    <span className="text-emerald-600 font-bold underline decoration-emerald-100 decoration-2 md:decoration-4 underline-offset-2">상담은 무료이며, 진행 여부는 자유롭게 결정하세요.</span>
                  </p>
                </div>

                <div className="bg-slate-900 text-white p-8 md:p-12 rounded-[32px] md:rounded-[48px] shadow-2xl space-y-6 md:space-y-8 relative overflow-hidden">
                   <h4 className="text-base md:text-xl font-black text-emerald-400 italic">3월 패키지 혜택 요약</h4>
                   <ul className="space-y-4 md:space-y-5 text-xs md:text-base font-bold">
                      <li className="flex justify-between border-b border-white/10 pb-3 md:pb-4"><span>프로그램</span> <span>실내/야외 120분</span></li>
                      <li className="flex justify-between border-b border-white/10 pb-3 md:pb-4"><span>상담가</span> <span className="text-emerald-400">185,000원</span></li>
                      <li className="flex justify-between border-b border-white/10 pb-3 md:pb-4"><span>특별 지원</span> <span className="text-yellow-400">제주 항공비*</span></li>
                      <li className="flex justify-between"><span>만족 보장</span> <span>100% 재레슨/환불</span></li>
                   </ul>
                </div>
              </div>

              <div className="bg-slate-50 p-7 md:p-14 rounded-[32px] md:rounded-[56px] border border-slate-200">
                ${status === "SUCCESS" ? html`
                  <div className="text-center py-12 md:py-20">
                    <div className="text-5xl md:text-7xl mb-6 md:mb-10">🏌️‍♂️</div>
                    <h3 className="text-xl md:text-3xl font-black mb-2 md:mb-4">상담 예약 접수 완료</h3>
                    <p className="text-xs md:text-base text-slate-500 font-medium">매니저가 확인 후 30분 내로 <br/> 카카오톡 안내를 보내드립니다.</p>
                  </div>
                ` : html`
                  <form onSubmit=${handleSubmit} className="space-y-6 md:space-y-8">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
                      <div className="space-y-1.5 md:space-y-2">
                         <label className="text-[10px] md:text-[11px] font-black text-slate-400 ml-1 tracking-widest uppercase">성함</label>
                         <input required name="이름" placeholder="홍길동" className="w-full p-4 md:p-5 rounded-xl md:rounded-2xl bg-white border-none focus:ring-2 focus:ring-emerald-500 shadow-sm text-base" />
                      </div>
                      <div className="space-y-1.5 md:space-y-2">
                         <label className="text-[10px] md:text-[11px] font-black text-slate-400 ml-1 tracking-widest uppercase">연락처</label>
                         <input required name="연락처" type="tel" placeholder="010-0000-0000" className="w-full p-4 md:p-5 rounded-xl md:rounded-2xl bg-white border-none focus:ring-2 focus:ring-emerald-500 shadow-sm text-base" />
                      </div>
                    </div>

                    <div className="space-y-3 md:space-y-4">
                       <label className="text-[10px] md:text-[11px] font-black text-emerald-600 ml-1 tracking-widest uppercase italic">희망 일정 (중복 선택)</label>
                       <div className="grid grid-cols-2 gap-2 md:gap-3">
                         ${["평일 낮", "평일 저녁", "주말 낮", "주말 저녁"].map(time => html`
                           <label key=${time} className="flex items-center gap-2 md:gap-3 p-3.5 md:p-4 bg-white rounded-xl md:rounded-2xl cursor-pointer hover:bg-emerald-50 transition-all shadow-sm border border-transparent">
                             <input type="checkbox" name="희망시간[]" value=${time} className="w-4 h-4 md:w-5 md:h-5 accent-emerald-600 rounded-md" />
                             <span className="text-[11px] md:text-sm font-bold text-slate-700">${time}</span>
                           </label>
                         `)}
                       </div>
                    </div>

                    <div className="pt-2 md:pt-4">
                      <button disabled=${status==="SUBMITTING"} className="w-full py-5 md:py-6 bg-emerald-600 text-white rounded-xl md:rounded-[24px] text-lg md:text-2xl font-[900] shadow-xl hover:bg-emerald-700 transition-all active:scale-95">
                        ${status === "SUBMITTING" ? "전송 중..." : "상담 예약하기 (무료)"}
                      </button>
                    </div>
                    <p className="text-center text-[10px] md:text-xs text-slate-400 font-medium leading-relaxed italic">
                      ※ 상담 중 언제든 자유롭게 취소가 가능합니다.
                    </p>
                  </form>
                `}
              </div>
            </div>
          </${Section}>
        `;
      };

      const RecentSignupToast = () => {
        const messages = useMemo(() => ([
          "이OO님 방금 주말 오후 상담 신청",
          "서OO님 앱 포인트 5,000원 적립",
          "김OO님 1:1 채팅 문의 중",
          "최OO님 주말 저녁 상담 신청 완료",
          "박OO님 평일 오전 숏게임 상담 신청"
        ]), []);
        const [open, setOpen] = useState(true);
        const [idx, setIdx] = useState(0);

        useEffect(() => {
          if (!open) return;
          const t = setInterval(() => setIdx((v) => (v + 1) % messages.length), 6000);
          return () => clearInterval(t);
        }, [open, messages.length]);

        if (!open) return null;

        return html`
          <div className="fixed left-4 bottom-20 md:bottom-8 z-[60] max-w-[280px] md:max-w-sm w-full">
            <div className="bg-white/95 backdrop-blur border border-slate-200 shadow-xl rounded-2xl px-4 py-3 md:px-5 md:py-4 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 md:w-10 md:h-10 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-600 font-black text-xs">✓</div>
                <div>
                  <div className="text-[11px] md:text-sm font-black text-slate-900 leading-none">${messages[idx]}</div>
                  <div className="text-[9px] md:text-[11px] text-slate-400 font-bold mt-1 tracking-tight">실시간 현황</div>
                </div>
              </div>
              <button className="text-slate-300 hover:text-slate-600 font-black text-lg" onClick=${() => setOpen(false)}>×</button>
            </div>
          </div>
        `;
      };

      const Footer = () => html`
        <footer className="bg-slate-900 text-white py-16 md:py-24 px-6 rounded-t-[40px] md:rounded-t-[60px]">
          <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-start gap-12 md:gap-16">
            <div className="space-y-4 md:space-y-6">
              <div className="text-2xl font-black italic tracking-tighter uppercase text-emerald-500 leading-none">Seuseungnim</div>
              <p className="max-w-xs text-xs md:text-sm text-slate-400 font-medium leading-relaxed">대한민국에서 가장 실질적인 레슨 솔루션을 제공하는 플랫폼, 스승님입니다.</p>
            </div>
            <div className="flex gap-12 md:gap-20">
               <div className="space-y-4">
                  <h5 className="text-[10px] md:text-xs font-black uppercase tracking-widest text-slate-500">Legal</h5>
                  <ul className="space-y-2 text-xs md:text-sm font-bold text-slate-300">
                    <li><a href="#" className="hover:text-emerald-400">이용약관</a></li>
                    <li><a href="#" className="hover:text-emerald-400 font-black text-white">개인정보처리방침</a></li>
                  </ul>
               </div>
               <div className="space-y-4">
                  <h5 className="text-[10px] md:text-xs font-black uppercase tracking-widest text-slate-500">Contact</h5>
                  <ul className="space-y-2 text-xs md:text-sm font-bold text-slate-300">
                    <li><a href="#" className="hover:text-emerald-400">채널: @스승님</a></li>
                    <li><a href="#" className="hover:text-emerald-400">02-1551-0641</a></li>
                  </ul>
               </div>
            </div>
          </div>
          <div className="max-w-6xl mx-auto mt-12 pt-8 border-t border-white/5 text-[9px] md:text-[10px] text-slate-700 font-bold uppercase tracking-widest">
             © 2026 Seuseungnim Corp. All rights reserved.
          </div>
        </footer>
      `;

      const MobileStickyCTA = () => html`
        <div className="md:hidden fixed bottom-4 left-4 right-4 z-50 flex gap-2">
          <a href="https://ssnim.com/install.html" target="_blank" className="flex-1 py-3.5 bg-slate-900 text-white rounded-xl font-black text-[11px] flex items-center justify-center shadow-lg border border-white/10">
             앱설치(포인트)
          </a>
          <button onClick=${() => scrollToId('apply')} className="flex-[2.5] py-3.5 bg-emerald-600 text-white rounded-xl font-black text-[13px] shadow-lg active:scale-95 transition-transform pulse-soft">
            3월 잔여석 상담 예약 (무료)
          </button>
        </div>
      `;

      const App = () => html`
        <div className="bg-white min-h-screen">
          <${Header} />
          <main>
            <${Hero} />
            <${UrgencyStats} />
            <${InstructorIntro} />
            <${AppBenefit} />
            <${Curriculum} />
            <${ApplicationForm} />
          </main>
          <${Footer} />
          <${MobileStickyCTA} />
          <${RecentSignupToast} />
        </div>
      `;

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(html`<${App} />`);
    </script>
  </body>
</html>
