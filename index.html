<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>스승님 | 3월 한정 숏게임 마스터 실전 레슨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
      body { font-family: "Pretendard", sans-serif; scroll-behavior: smooth; word-break: keep-all; }
      .glass-nav { backdrop-filter: blur(12px); background-color: rgba(255, 255, 255, 0.8); }
      .fade-in { opacity: 0; transform: translateY(20px); transition: all 0.6s ease-out; }
      .fade-in.visible { opacity: 1; transform: translateY(0); }
      .timer-badge { animation: pulse 2s infinite; }
      @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
      .app-gradient { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="module">
      import React, { useEffect, useMemo, useRef, useState } from "https://esm.sh/react@19.2.0";
      import ReactDOM from "https://esm.sh/react-dom@19.2.0/client";
      import htm from "https://esm.sh/htm@3.1.1";

      const html = htm.bind(React.createElement);

      // --- Icons ---
      const KakaoIcon = () => html`
        <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3C6.477 3 2 6.48 2 10.77C2 13.52 3.84 15.93 6.64 17.33L5.47 21.64C5.41 21.84 5.51 22.04 5.71 22.1C5.81 22.13 5.91 22.11 5.99 22.05L11.23 18.52C11.48 18.53 11.74 18.54 12 18.54C17.52 18.54 22 15.06 22 10.77C22 6.48 17.52 3 12 3Z" fill="currentColor"/>
        </svg>
      `;

      // --- Utility ---
      const scrollToId = (id) => {
        const el = document.getElementById(id);
        if (el) window.scrollTo({ top: el.offsetTop - 80, behavior: "smooth" });
      };

      // --- Components ---
      const Section = ({ id, className = "", children }) => {
        const ref = useRef(null);
        const [isVisible, setIsVisible] = useState(false);

        useEffect(() => {
          const observer = new IntersectionObserver(([entry]) => {
            if (entry.isIntersecting) { setIsVisible(true); observer.unobserve(entry.target); }
          }, { threshold: 0.1 });
          if (ref.current) observer.observe(ref.current);
          return () => observer.disconnect();
        }, []);

        return html`<section id=${id} ref=${ref} className=${`py-16 md:py-24 px-6 ${className} fade-in ${isVisible ? "visible" : ""}`}>
          ${children}
        </section>`;
      };

      const Badge = ({ text, color = "bg-emerald-500" }) => html`
        <span className=${`${color} text-white px-3 py-1 rounded-full text-[10px] md:text-xs font-bold mr-2 inline-block`}>${text}</span>
      `;

      const CountdownTimer = () => {
        const [timeLeft, setTimeLeft] = useState({ hours: 0, minutes: 0, seconds: 0 });
        useEffect(() => {
          const target = new Date();
          target.setHours(23, 59, 59);
          const timer = setInterval(() => {
            const now = new Date();
            const diff = target - now;
            if (diff <= 0) target.setDate(target.getDate() + 1);
            else setTimeLeft({
              hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
              minutes: Math.floor((diff / 1000 / 60) % 60),
              seconds: Math.floor((diff / 1000) % 60)
            });
          }, 1000);
          return () => clearInterval(timer);
        }, []);

        return html`
          <div className="bg-slate-900 text-white px-4 py-2 rounded-full text-xs font-black timer-badge flex items-center gap-2">
            오늘 상담 신청 우선 배정 마감까지 ${timeLeft.hours.toString().padStart(2, '0')}:${timeLeft.minutes.toString().padStart(2, '0')}:${timeLeft.seconds.toString().padStart(2, '0')}
          </div>
        `;
      };

      const Header = () => html`
        <nav className="fixed top-0 left-0 w-full z-50 glass-nav border-b border-slate-100">
          <div className="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div className="text-xl font-black text-emerald-600 cursor-pointer" onClick=${() => window.scrollTo({top:0, behavior:'smooth'})}>스승님</div>
            <div className="hidden md:flex space-x-6 text-sm font-bold items-center">
              <a href="#curriculum" onClick=${(e) => (e.preventDefault(), scrollToId('curriculum'))} className="hover:text-emerald-600 transition-colors">커리큘럼</a>
              <a href="#app-benefit" onClick=${(e) => (e.preventDefault(), scrollToId('app-benefit'))} className="text-emerald-600 transition-colors">앱 혜택</a>
              <a href="#apply" onClick=${(e) => (e.preventDefault(), scrollToId('apply'))} className="hover:text-emerald-600 transition-colors">상담신청</a>
              <a href="https://ssnim.com/install.html" target="_blank" className="bg-slate-900 text-white px-5 py-2 rounded-xl hover:bg-slate-800 transition-all text-xs">앱 다운로드</a>
            </div>
            <div className="md:hidden">
               <${CountdownTimer} />
            </div>
          </div>
        </nav>
      `;

      const Hero = () => html`
        <section className="pt-28 md:pt-40 pb-12 md:pb-20 px-6 bg-white overflow-hidden relative text-center">
          <div className="max-w-7xl mx-auto relative z-10">
            <div className="hidden md:flex justify-center mb-8">
              <${CountdownTimer} />
            </div>
            <h1 className="text-[30px] md:text-7xl font-black tracking-tight leading-[1.2] md:leading-[1.1] mb-6 md:mb-8 text-slate-900">
              올해 골프 라이프 베스트 스코어,<br />
              <span className="text-emerald-600">숏게임에서 무너지지 마세요</span>
            </h1>
            <p className="text-base md:text-2xl text-slate-500 mb-10 md:mb-12 font-medium max-w-3xl mx-auto px-4">
              라운드 가기 전 120분 집중 레슨으로,<br className="md:hidden" />
              올 한 해 여러분의 <span className="text-slate-900 font-bold underline decoration-emerald-300 decoration-4">진짜 스코어</span>를 지켜드립니다.
            </p>
            <div className="flex flex-col gap-4 justify-center items-center px-4 max-w-md mx-auto">
              <button onClick=${() => scrollToId('apply')} className="w-full px-10 py-5 bg-emerald-600 text-white rounded-2xl text-lg md:text-xl font-black shadow-xl hover:bg-emerald-700 transition-all active:scale-95">
                3월 잔여석 무료 상담신청
              </button>
              <div className="flex items-center gap-2 text-slate-400 text-[11px] md:text-sm font-bold">
                 <span>✓ 카드 결제 가능</span>
                 <span className="w-1 h-1 bg-slate-200 rounded-full"></span>
                 <span>✓ 만족도 100% 보장 정책</span>
              </div>
            </div>
          </div>
        </section>
      `;

      const AppBenefit = () => html`
        <${Section} id="app-benefit" className="bg-slate-900 text-white relative overflow-hidden">
          <div className="absolute top-0 right-0 w-96 h-96 bg-emerald-500/10 blur-[100px]"></div>
          <div className="max-w-7xl mx-auto relative z-10">
            <div className="text-center mb-12 md:mb-16">
              <Badge text="APP ONLY" color="bg-emerald-500" />
              <h2 className="text-3xl md:text-5xl font-black mt-4 tracking-tighter">앱 설치 시 더 커지는 혜택</h2>
            </div>
            <div className="grid md:grid-cols-4 gap-4 md:gap-6 text-left">
              ${[
                {i: "💬", t: "서수연 프로 직접 채팅", d: "레슨 전 궁금한 점을 앱에서 직접 물어보세요"},
                {i: "💰", t: "레슨 포인트 즉시 지급", d: "앱 회원 한정, 결제 시 사용 가능한 포인트 적립"},
                {i: "☕", t: "메가커피 100% 증정", d: "앱 내 후기 작성 시 기프티콘 전원 발송(월 한정)"},
                {i: "🔔", t: "3월 이벤트 우선 매칭", d: "마감 전 가장 빠르게 할인 소식 푸시 알림"}
              ].map(item => html`
                <div key=${item.t} className="bg-white/5 p-8 rounded-[32px] border border-white/10 hover:bg-white/10 transition-all">
                  <div className="text-4xl mb-6">${item.i}</div>
                  <h4 className="text-xl font-black mb-3 text-emerald-400">${item.t}</h4>
                  <p className="text-slate-400 text-sm leading-relaxed font-medium">${item.d}</p>
                </div>
              `)}
            </div>
            <div className="mt-12 text-center">
              <a href="https://ssnim.com/install.html" target="_blank" className="inline-block px-12 py-5 app-gradient rounded-2xl font-black text-xl shadow-2xl shadow-emerald-900/50 hover:scale-105 transition-all">
                혜택 가득한 앱 다운로드 받기
              </a>
            </div>
          </div>
        </${Section}>
      `;

      const QuickSummary = () => html`
        <${Section} className="py-8 md:py-12 bg-white border-b border-slate-100">
          <div className="max-w-7xl mx-auto">
            <div className="grid grid-cols-2 md:grid-cols-5 gap-6 text-center">
              ${[
                {l: "결제", v: "카드 결제 가능*"},
                {l: "장소", v: "판교 / 용인 인근"},
                {l: "구성", v: "실내 2h or 야외 2h"},
                {l: "혜택", v: "제주 항공비 지원*"},
                {l: "보장", v: "상담 후 진행 결정"}
              ].map(item => html`
                <div key=${item.l} className="space-y-1">
                  <div className="text-emerald-600 text-[10px] md:text-xs font-black uppercase tracking-widest">${item.l}</div>
                  <div className="text-slate-900 text-sm md:text-lg font-bold">${item.v}</div>
                </div>
              `)}
            </div>
            <p className="text-center text-[10px] text-slate-300 mt-6 font-medium">*할부/무이자 및 상세 혜택 조건은 카드사 및 운영 정책에 따름</p>
          </div>
        </${Section}>
      `;

      const InstructorIntro = () => html`
        <${Section} className="bg-white py-16 md:py-24">
          <div className="max-w-4xl mx-auto flex flex-col md:flex-row items-center gap-8 md:gap-16">
            <div className="relative">
              <div className="w-48 h-48 md:w-64 md:h-64 bg-slate-100 rounded-[48px] overflow-hidden shadow-2xl border-4 border-white rotate-3">
                 <img loading="lazy" src="https://images.unsplash.com/photo-1593111774240-d529f12cf4bb?auto=format&fit=crop&q=80&w=400" className="w-full h-full object-cover" alt="서수연 프로" />
              </div>
            </div>
            <div className="text-center md:text-left space-y-6 flex-1 px-4">
              <div>
                <h3 className="text-3xl md:text-5xl font-black text-slate-900 tracking-tighter italic">서수연 프로</h3>
                <p className="text-emerald-600 font-bold text-lg mt-2 underline decoration-emerald-200 decoration-4 underline-offset-4">"스코어의 차이는 필드 감각에서 옵니다"</p>
              </div>
              <p className="text-slate-600 font-medium leading-relaxed text-base md:text-lg">
                연습장과 필드는 다릅니다. 경사지에서의 터치감,<br className="hidden md:block" /> 
                상황별 클럽 선택, 그리고 그린 주변의 멘탈까지.<br />
                당장 이번 주 라운딩에서 써먹을 수 있는 기술만 전수합니다.
              </p>
              <div className="flex flex-wrap justify-center md:justify-start gap-3">
                <a href="https://www.instagram.com/s.o_o.yeon/" target="_blank" className="inline-flex items-center gap-2 bg-slate-100 px-6 py-3 rounded-xl font-bold text-sm hover:bg-slate-200 transition-all">
                  인스타그램 확인하기
                </a>
                <a href="http://pf.kakao.com/_kxawRn/chat" target="_blank" className="inline-flex items-center gap-2 bg-[#FEE500] px-6 py-3 rounded-xl font-bold text-sm text-[#3c1e1e] hover:bg-[#F7DC00] transition-all">
                  <${KakaoIcon} /> 스승님 운영팀 상담
                </a>
              </div>
            </div>
          </div>
        </${Section}>
      `;

      const Curriculum = () => html`
        <${Section} id="curriculum" className="bg-slate-50">
          <div className="max-w-7xl mx-auto text-center">
            <h2 className="text-3xl md:text-5xl font-black mb-16 tracking-tighter leading-tight italic">실전 마스터 120분 패키지</h2>
            <div className="grid md:grid-cols-2 gap-6 md:gap-8 text-left">
              <div className="bg-white p-8 md:p-12 rounded-[48px] shadow-sm border border-slate-100">
                <div className="mb-10 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <Badge text="PART 1" color="bg-blue-600" />
                    <span className="text-xl font-black text-slate-900">실내 판교 백야드</span>
                  </div>
                  <a href="https://maps.google.com/?q=성남시+분당구+판교역로+백야드" target="_blank" className="text-xs text-slate-400 font-bold underline">분당구 위치보기</a>
                </div>
                <ul className="space-y-8">
                  ${[
                    {t: "뒤땅/탑볼 컨택 교정", d: "볼 위치와 체중 이동의 근본적 문제 해결"},
                    {t: "20m 이내 '붙이는' 거리감", d: "손목 제어와 일관성 있는 몸통 리듬 습득"},
                    {t: "퍼터 방향성 스트로크 교정", d: "정확한 에이밍과 스퀘어 임팩트 습득"},
                    {t: "벙커 탈출 기초 다지기", d: "모래 스윙 원리와 셋업의 정석"}
                  ].map((item, idx) => html`
                    <li key=${idx} className="flex gap-5">
                      <span className="text-blue-500 font-black text-2xl italic">${(idx + 1).toString().padStart(2, '0')}</span>
                      <div>
                        <h4 className="font-bold text-lg text-slate-900">${item.t}</h4>
                        <p className="text-slate-500 text-sm mt-1 leading-relaxed">${item.d}</p>
                      </div>
                    </li>
                  `)}
                </ul>
              </div>
              <div className="bg-emerald-600 p-8 md:p-12 rounded-[48px] shadow-2xl text-white">
                <div className="mb-10 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <Badge text="PART 2" color="bg-white/20" />
                    <span className="text-xl font-black">야외 숏게임힐스 or 파3</span>
                  </div>
                  <a href="https://maps.google.com/?q=용인시+처인구+숏게임힐스" target="_blank" className="text-xs text-emerald-100 font-bold underline">모현 인근 위치보기</a>
                </div>
                <ul className="space-y-8">
                  ${[
                    {t: "30~90m 웨지 컨트롤", d: "거리별 클럽 선택과 비거리 정밀 조절"},
                    {t: "경사지 트러블샷 대응", d: "내리막/오르막 상황별 에이밍 노하우"},
                    {t: "3퍼트 방지 실전 퍼팅", d: "그린 경사 분석과 롱 퍼트 거리감 매칭"},
                    {t: "스코어 매니지먼트 전략", d: "상황별 타수를 지키는 코스 공략법"}
                  ].map((item, idx) => html`
                    <li key=${idx} className="flex gap-5">
                      <span className="text-emerald-200 font-black text-2xl italic">${(idx + 1).toString().padStart(2, '0')}</span>
                      <div>
                        <h4 className="font-bold text-lg text-white">${item.t}</h4>
                        <p className="text-emerald-50/70 text-sm mt-1 leading-relaxed">${item.d}</p>
                      </div>
                    </li>
                  `)}
                </ul>
              </div>
            </div>
          </div>
        </${Section}>
      `;

      const Process = () => html`
        <${Section} id="process" className="bg-white">
          <div className="max-w-7xl mx-auto text-center">
            <h2 className="text-2xl md:text-5xl font-black mb-16 tracking-tighter">신청부터 레슨까지</h2>
            <div className="relative grid md:grid-cols-5 gap-8">
              <div className="hidden md:block absolute top-6 left-0 w-full h-0.5 bg-slate-100 z-0"></div>
              ${[
                {i: "📝", t: "상담 신청", d: "폼 작성 (10초)"},
                {i: "💬", t: "카톡/문자 안내", d: "10분 내 세부 안내"},
                {i: "📅", t: "일정/장소 확정", d: "희망 일정 조율"},
                {i: "💳", t: "상담 후 결제", d: "확정 시 카드/포인트"},
                {i: "⛳", t: "레슨 진행", d: "실전 실력 완성"}
              ].map((step, idx) => html`
                <div key=${idx} className="relative z-10 space-y-4">
                  <div className="w-12 h-12 bg-white border-2 border-slate-100 rounded-full flex items-center justify-center mx-auto text-xl shadow-sm">
                    ${step.i}
                  </div>
                  <div>
                    <h4 className="font-bold text-slate-900 text-sm md:text-base">${step.t}</h4>
                    <p className="text-slate-400 text-[11px] mt-1 font-medium">${step.d}</p>
                  </div>
                </div>
              `)}
            </div>
          </div>
        </${Section}>
      `;

      const ApplicationForm = () => {
        const [status, setStatus] = useState("IDLE");
        const handleSubmit = async (e) => {
          e.preventDefault();
          setStatus("SUBMITTING");
          const formData = new FormData(e.currentTarget);
          try {
            const response = await fetch("https://formspree.io/f/mbdakbon", {
              method: "POST",
              body: JSON.stringify(Object.fromEntries(formData)),
              headers: { Accept: "application/json", "Content-Type": "application/json" }
            });
            if (response.ok) setStatus("SUCCESS");
            else setStatus("ERROR");
          } catch { setStatus("ERROR"); }
        };

        return html`
          <${Section} id="apply" className="bg-white">
            <div className="max-w-5xl mx-auto">
              <div className="text-center mb-12">
                <h2 className="text-3xl md:text-5xl font-black mb-4 tracking-tighter italic">3월 숏게임 상담예약</h2>
                <p className="text-slate-500 font-bold px-4">예약 주소는 확정 시 카카오톡으로 개별 안내드립니다.</p>
              </div>

              <div className="grid lg:grid-cols-5 gap-8 items-start">
                <div className="lg:col-span-2 space-y-4">
                  <div className="bg-slate-900 text-white p-8 rounded-[48px] shadow-2xl relative overflow-hidden">
                    <h4 className="font-black text-xl mb-8 text-emerald-400">레슨 패키지 요약</h4>
                    <ul className="space-y-6 text-sm md:text-base font-bold">
                      <li className="flex justify-between border-b border-white/10 pb-4 italic">
                         <span>3월 할인가</span> <span>185,000원</span>
                      </li>
                      <li className="flex justify-between border-b border-white/10 pb-4">
                         <span>장소</span> <span>판교 / 용인 인근</span>
                      </li>
                      <li className="flex justify-between border-b border-white/10 pb-4">
                         <span>결제 방식</span> <span>카드 / 앱 포인트*</span>
                      </li>
                      <li className="flex justify-between text-emerald-400">
                         <span>보장 제도</span> <span>만족 보장 정책*</span>
                      </li>
                    </ul>
                  </div>
                  <div className="bg-emerald-50 p-6 rounded-[32px] border border-emerald-100 text-center">
                     <p className="text-emerald-800 text-sm font-bold leading-relaxed">
                       👥 3월 스승님 이벤트 <br/>
                       <span className="text-xl text-emerald-600 font-black italic">참여자 전원 제주도 캠프 항공비 지원!</span>
                     </p>
                  </div>
                </div>

                <div className="lg:col-span-3 bg-slate-50 p-6 md:p-10 rounded-[48px] border border-slate-200">
                  ${status === "SUCCESS" ? html`
                    <div className="text-center py-10">
                      <div className="text-6xl mb-6">🎯</div>
                      <h3 className="text-2xl font-black mb-2">상담 예약 완료!</h3>
                      <p className="text-slate-500 font-medium">확인 후 순차적으로 상세 안내 드립니다.</p>
                    </div>
                  ` : html`
                    <form onSubmit=${handleSubmit} className="space-y-6">
                      <div className="grid md:grid-cols-2 gap-4">
                        <div className="space-y-1">
                          <label className="text-[10px] font-black text-slate-400 ml-1 uppercase">성함</label>
                          <input required name="이름" placeholder="홍길동" className="w-full p-4 rounded-2xl bg-white border-none outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm" />
                        </div>
                        <div className="space-y-1">
                          <label className="text-[10px] font-black text-slate-400 ml-1 uppercase">연락처</label>
                          <input required name="연락처" type="tel" placeholder="010-0000-0000" className="w-full p-4 rounded-2xl bg-white border-none outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm" />
                        </div>
                      </div>
                      <div className="space-y-2">
                        <label className="text-[10px] font-black text-emerald-600 ml-1 uppercase tracking-widest italic">희망 일정 (중복 선택 가능 - 최대 2개)</label>
                        <div className="grid grid-cols-2 gap-2">
                          ${["평일 오전/오후", "평일 저녁", "주말 오전/오후", "주말 저녁"].map(time => html`
                            <label key=${time} className="flex items-center gap-2 p-3 bg-white rounded-xl cursor-pointer hover:bg-emerald-50 transition-all shadow-sm">
                              <input type="checkbox" name="희망시간[]" value=${time} className="w-4 h-4 accent-emerald-600" />
                              <span className="text-xs font-bold text-slate-700">${time}</span>
                            </label>
                          `)}
                        </div>
                      </div>
                      <button disabled=${status==="SUBMITTING"} className="w-full py-5 md:py-6 bg-emerald-600 text-white rounded-2xl text-lg md:text-2xl font-black shadow-xl shadow-emerald-200 hover:bg-emerald-700 transition-all active:scale-95">
                        ${status === "SUBMITTING" ? "전송 중..." : "상담 신청하기 (결제 아님)"}
                      </button>
                      <p className="text-center text-[10px] md:text-xs text-slate-400 font-bold leading-tight px-4">
                         ※ 신청 후 상담 과정에서 <span className="text-red-400 underline decoration-red-200 underline-offset-2">언제든 취소 가능</span>하며 불이익이 없습니다.
                      </p>
                    </form>
                  `}
                </div>
              </div>
            </div>
          </${Section}>
        `;
      };

      const Reviews = () => {
        const reviews = [
          {name: "박*준", score: "내리막 트러블샷 교정", text: "항상 내리막 경사에서 뒤땅 쳐서 멘탈 나갔었는데, 무게 중심 잡는 법 하나로 공이 깨끗하게 맞기 시작했습니다."},
          {name: "이*혜", score: "벙커 공포 극복", text: "벙커에서 못 나오던 제가 이제 한 번에 핀 근처로 보냅니다. 모래 터치하는 감각이 뭔지 정확히 배웠어요."},
          {name: "김*태", score: "3퍼트 제로 달성", text: "롱 퍼트 거리감이 아예 없었는데 프로님이 알려주신 리듬 덕분에 이번 라운딩 3퍼트 한 번도 안 했습니다."}
        ];

        return html`
          <${Section} className="bg-slate-50">
            <div className="max-w-7xl mx-auto">
              <h2 className="text-2xl md:text-4xl font-black text-center mb-12 tracking-tighter italic underline decoration-emerald-200 decoration-8 underline-offset-8">수강생 리얼 후기</h2>
              <div className="grid md:grid-cols-3 gap-6">
                ${reviews.map(r => html`
                  <div className="bg-white p-8 rounded-[40px] shadow-sm border border-slate-100 flex flex-col justify-between">
                    <div>
                      <div className="text-emerald-500 mb-4 text-sm">⭐⭐⭐⭐⭐</div>
                      <p className="text-slate-700 font-medium mb-8 leading-relaxed italic">"${r.text}"</p>
                    </div>
                    <div className="flex justify-between items-center pt-4 border-t border-slate-50">
                      <span className="font-bold text-slate-900">${r.name} 님</span>
                      <span className="text-[10px] bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full font-black uppercase tracking-tight">${r.score}</span>
                    </div>
                  </div>
                `)}
              </div>
            </div>
          </${Section}>
        `;
      };

      const FAQ = () => {
        const [open, setOpen] = useState(null);
        const items = [
          {q: "카드 결제가 가능한가요?", a: "네, 모든 카드 결제가 가능하며 전 카드사 무이자 할부 혜택도 상담 시 확인하실 수 있습니다. (카드사별 정책 상이)"},
          {q: "앱으로 신청하면 어떤 점이 좋나요?", a: "앱에서는 서수연 프로와 1:1 채팅이 가능하며, 신청 시 포인트 지급, 후기 작성 시 기프티콘 전원 증정 등 더 많은 혜택을 누릴 수 있습니다."},
          {q: "만족 보장 정책이 무엇인가요?", a: "레슨 종료 후 24시간 이내에 만족스럽지 못한 사유와 함께 요청 시, 1회에 한해 무료 재레슨 또는 상담 후 100% 환불 중 선택하실 수 있습니다."}
        ];
        return html`
          <${Section} className="bg-white">
            <div className="max-w-3xl mx-auto">
              <h2 className="text-2xl md:text-4xl font-black mb-12 text-center tracking-tighter">궁금한 점 확인</h2>
              <div className="space-y-4 px-2">
                ${items.map((item, idx) => html`
                  <div key=${idx} className="bg-slate-50 rounded-[24px] overflow-hidden transition-all shadow-sm border border-slate-100">
                    <button onClick=${() => setOpen(open === idx ? null : idx)} className="w-full p-6 text-left flex justify-between items-center font-bold text-sm md:text-base">
                      <span className=${open === idx ? 'text-emerald-600' : 'text-slate-900'}>${item.q}</span>
                      <span className=${`transform transition-transform text-xs ${open === idx ? 'rotate-180' : ''}`}>▼</span>
                    </button>
                    ${open === idx && html`<div className="p-6 pt-0 text-slate-500 text-sm leading-relaxed font-medium">${item.a}</div>`}
                  </div>
                `)}
              </div>
            </div>
          </${Section}>
        `;
      };

      const Footer = () => html`
        <footer className="bg-slate-900 text-slate-500 py-16 px-6 text-[11px] md:text-sm">
          <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start gap-12">
            <div>
              <div className="text-white text-xl font-black mb-4 tracking-tighter italic uppercase">Seuseungnim</div>
              <p className="max-w-xs leading-relaxed opacity-60">당신에게 필요한 단 한 명의 실전 스승을 연결합니다.</p>
              <p className="mt-12 opacity-30 text-[10px]">© 2024 Seuseungnim Corp. All rights reserved.</p>
            </div>
            <div className="flex gap-16">
              <div>
                <h5 className="text-white font-bold mb-4 uppercase tracking-widest text-xs opacity-50">Support</h5>
                <p className="mb-2">카카오톡: @스승님</p>
                <p>평일 10:00 - 18:00</p>
              </div>
              <div>
                <h5 className="text-white font-bold mb-4 uppercase tracking-widest text-xs opacity-50">Legal</h5>
                <a href="#" className="block mb-2 hover:text-white">이용약관</a>
                <a href="#" className="block hover:text-white font-black">개인정보처리방침</a>
              </div>
            </div>
          </div>
        </footer>
      `;

      const MobileStickyCTA = () => html`
        <div className="md:hidden fixed bottom-6 left-6 right-6 z-50 flex gap-2">
          <a href="https://ssnim.com/install.html" target="_blank" className="flex-1 py-4 bg-slate-900 text-white rounded-2xl font-black text-xs flex items-center justify-center shadow-2xl border border-white/20">
             앱설치(혜택)
          </a>
          <button onClick=${() => scrollToId('apply')} className="flex-[2.5] py-4 bg-emerald-600 text-white rounded-2xl font-black text-sm shadow-2xl active:scale-95 transition-transform">
            3월 잔여석 상담신청
          </button>
        </div>
      `;

      const App = () => html`
        <div className="bg-white min-h-screen">
          <${Header} />
          <main>
            <${Hero} />
            <${QuickSummary} />
            <${AppBenefit} />
            <${InstructorIntro} />
            <${Curriculum} />
            <${Process} />
            <${Reviews} />
            <${ApplicationForm} />
            <${FAQ} />
          </main>
          <${Footer} />
          <${MobileStickyCTA} />
        </div>
      `;

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(html`<${App} />`);
    </script>
  </body>
</html>
